<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script>
      (function () {
        const search = window.location.search;

        if (search.startsWith("?/")) {
          const route = search
            .slice(2)
            .split("&")[0]
            .replace(/~and~/g, "&");

          const newPath =
            "/Pack-Bone-Consulting/" +
            route;

          window.history.replaceState(
            null,
            "",
            newPath
          );
        }
      })();
    </script>
     <link rel="icon" type="image/png" href="/pack-bone-logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pack Bone Consulting</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
