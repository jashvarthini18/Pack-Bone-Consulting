<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <!-- Google Search Console Verification -->
    <meta
      name="google-site-verification"
      content="B4pDlolM4eghnAO0obA0GOqEvmasGvqJd3qP6rDtP9M"
    />

    <script>
      (function () {
        const search = window.location.search;

        if (search.startsWith("?/")) {
          const route = search
            .slice(2)
            .split("&")[0]
            .replace(/~and~/g, "&");

          const newPath =
            "/Packbone-Consulting/" +
            route;

          window.history.replaceState(
            null,
            "",
            newPath
          );
        }
      })();
    </script>

    <link
      rel="icon"
      type="image/png"
      href="/pack-bone-logo.png"
    />

    <title>
      Packbone Consulting | Packaging Development Consultancy
    </title>

    <meta
      name="description"
      content="Packbone Consulting provides packaging development, NPD, vendor development, cost optimisation, testing, validation and packaging project management solutions."
    />
  </head>

  <body>
    <div id="root"></div>

    <script
      type="module"
      src="/src/main.jsx"
    ></script>
  </body>
</html>
